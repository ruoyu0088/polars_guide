name: deploy-book

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Copy shared/ into both books (a clean clone has no generated dirs).
      - name: Materialize shared assets
        run: python sync_assets.py --apply --all

      # 日本語版 → site/ja/
      - name: Build Japanese book
        run: |
          jupyter-book build polars_guide

      # 中文版 → site/zh/（_toc.yml が無い場合はスキップ）
      - name: Build Chinese book
        if: ${{ hashFiles('polars_guide_cn/_toc.yml') != '' }}
        run: |
          jupyter-book build polars_guide_cn

      # 1つのサイトにまとめる：/ に言語振り分け、/ja/ と /zh/ に各言語版
      - name: Assemble site
        run: |
          set -e
          rm -rf site
          mkdir -p site/ja site/zh
          cp -r polars_guide/_build/html/. site/ja/
          if [ -d polars_guide_cn/_build/html ]; then
            cp -r polars_guide_cn/_build/html/. site/zh/
          fi
          cp index_redirect.html site/index.html
          cp 404.html site/404.html
          cp google608cb34058acb7c0.html site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
