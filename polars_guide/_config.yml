# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Polarsガイド
author: <a href="https://www.feng.co.jp" target="_blank">株式会社フォン</a>
email: zhangry@feng.co.jp
copyright: "2024"

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: off

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Files that are not in _toc.yml (Pandas comparison drafts, airline example)
# are not part of the book and have no Chinese counterpart; keep them out of
# the build so the /ja/ and /zh/ sites have exactly the same pages.
exclude_patterns:
  - "110_polars_example_airline.ipynb"
  - "500_polars_pandas_getting_started.ipynb"
  - "510_polars_pandas_10_minutes.ipynb"
  - "515_polars_pandas_data.ipynb"
  - "520_polars_pandas_basic.ipynb"
  - "560_polars_pandas_multiIndex.ipynb"
  - "tmp_inplace_update.ipynb"

repository:
  url: https://github.com/ruoyu0088/polars_guide
  branch: main
  path_to_book: polars_guide

html:
  use_repository_button: true
  use_issues_button: true

sphinx:
  config:
    site_url: "https://ruoyu0088.github.io/polars_guide/ja/"
    sitemap_url_scheme: "{link}"
    language: ja
    # Jupyter Book 会用自己的那套 html_theme_options 覆盖这里，所以下面把 JB
    # 本来会自动填的几项一并写出，不能只写 navbar_persistent。
    # navbar_persistent: [] 用来关掉 pydata-sphinx-theme 0.17 默认注入的顶部
    # 搜索按钮：一旦它被注入，主题会多渲染一条顶部栏，其中的 primary-toggle
    # 又会抢走侧栏开关的 click 事件（页面上因此有两个同 class 的按钮）。
    html_theme_options:
      search_bar_text: "Search this book..."
      path_to_docs: polars_guide
      repository_url: "https://github.com/ruoyu0088/polars_guide"
      repository_branch: main
      use_repository_button: true
      use_issues_button: true
      navbar_persistent: []
    html_js_files:
      - lang-switch.js

  extra_extensions:
   - sphinxcontrib.mermaid
   - sphinx_sitemap